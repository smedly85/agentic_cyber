# The pipeline run configuration (default location: repo root).
# Models, endpoints and API keys are NOT configured here: put them in .env
# (see .env.example). CLI flags override values in this file.

[depth]
# language = "c"                 # "c" | "rust"
# input = "path/to/program.c"    # file or project directory
# depth = 2                      # omit to select every eligible reachable function
rule = "le"                      # eq | le | ge   (applies only when depth is set)
include_unreachable = false
order = "shallow_first"          # shallow_first | deep_first | source | random
seed = 0                         # used by order = "random"
accumulation = "cumulative"      # cumulative | independent
output_dir = "runs/depth"
parallel = 1                     # functions diversified concurrently (-j). Cumulative mode runs in
                                 # waves of this size and merges accepted candidates in order.

[callgraph]
c_backend = "svf"                # svf | module:Class
rust_backend = "rupta"           # rupta | mir | module:Class

[edit]
allow_new_helpers = true
allow_new_includes = true
allow_new_globals_types = true

[agent]
generator = "minisweagent"       # minisweagent | module:Class
topology = "single"              # single | planner_worker | orchestrator
model_class = "litellm"          # litellm (tool calls) | litellm_textbased | litellm_response
step_limit = 0                   # 0 = harness default
command_timeout_s = 900

# Per-role sampling; omitted keys use the server default.
[agent.sampling.worker]
# temperature = 0.7
# top_p = 0.95
# seed = 42
# max_tokens = 8192
# num_ctx = 65536

[agent.sampling.planner]

[agent.sampling.orchestrator]

[retry]
max_loops = 3                    # fresh repair sessions after the first
session_timeout_s = 1800

[retry.token_budget]
enabled = false
limit = 0

[tests]
# visible_suite = "path/to/visible-suite"   # dir with executable `run`
# hidden_suite = "path/to/hidden-suite"     # never shown to the agent

[tests.feedback]
max_failures = 25
max_detail_chars = 300

[build]
# cmd = "make"                   # omit to let the pipeline build automatically
flags = []

[lineage]
# lineage mode drives src/harness/run_lineage_experiment.sh -> run_experiment.sh unchanged
# (stage plan, test bundles, repair loop, Docker build/judge, held-out judge,
# security evaluation, fingerprints). The pipeline supplies the generator.
# utility = "c-sort"             # selector <language>-<utility>: coreutils/<utility>/manifests/<language>.json
generator = "minisweagent"       # minisweagent (agent in Docker, uses [agent] topology) | aider (host Aider)
lineages = 1                     # independent development traces
lineage_start = 1
parallel = 1                     # lineages run concurrently (one script process each, -j)
output_root = "runs/lineage"   # default dir: <root>/<utility>/<generator label>/temp-<T>
# output_dir = "runs/lineage/c-sort/my-run"   # explicit dir (resuming needs the same config)
force = false
keep_workdir = false
allow_no_progress = false
# repair_prompt = "coreutils/shared/repair_continuation_template.md"
analyze = false                  # run src/harness/analyze_lineages.py afterwards
# check_cmd = "gcc -std=c11 -Wall -Werror {source} -o {output}"   # agent-side agent-build override

# Forwarded to the scripts and fingerprinted; with generator = "minisweagent"
# they apply to every agent role ([agent.sampling] is depth mode only).
[lineage.sampling]
temperature = 0.0
# top_p = 0.95
# sampling_seed = 42             # or lineage_seed_base (mutually exclusive)
# lineage_seed_base = 1000
# max_tokens = 8192
# num_ctx = 32768                # Ollama context; its small default truncates long sessions
# architect_think = "false"      # false | low | medium | high

[lineage.security]
enabled = true
fuzz_seconds = 10
seed = 1
timeout = 2
max_inputs = 100

[lineage.aider]
bin = "aider"
editor_edit_format = "editor-diff"   # whole | editor-diff

[cache]
enabled = true
dir = "runs/cache"          # shared by depth and lineage runs (gitignored)
steps = true                     # call graphs, locate, baseline/verification/hidden-suite results
llm = "record"                   # off | record | auto (reuse a matching response) | replay (never call a model)
match = "exact"                  # exact (same conversation) | sequence (same call index; for testing pipeline changes)
namespace = ""                   # change to get fresh samples while sharing one cache

[docker]
c_image = "agent-c:latest"
rust_image = "agent-rust:latest"
cpus = 2
memory = "4g"
pids = 512
agent_network = "auto"          # auto | host | bridge (agent sessions only)
