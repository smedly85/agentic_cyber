name: mkdir macOS diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: GNU mkdir 9.11 on macOS
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record macOS environment
        run: |
          set -euo pipefail
          {
            echo "=== macOS environment ==="
            sw_vers
            echo
            echo "architecture: $(uname -m)"
            echo "shell: $SHELL"
            echo "umask: $(umask)"
            echo "python: $(python3 --version)"
          } | tee macos-environment.txt

      - name: Install and verify GNU Coreutils 9.11
        run: |
          set -euo pipefail

          brew install coreutils

          GNU_MKDIR="$(brew --prefix coreutils)/libexec/gnubin/mkdir"

          if [[ ! -x "$GNU_MKDIR" ]]; then
            echo "GNU mkdir was not found at: $GNU_MKDIR" >&2
            e            e            e            e            e      rs            e            e   echo             e      IR"           B_               ech    ra          $GNU_MKDIR"
          echo "oracle version: $VERSION"

          if [[ "$VERSION" != "mkdir (GNU coreutils) 9.11" ]]; then
            echo "Expected GNU Coreutils 9.11, but found: $VERSION" >&2
            exit 1
          fi

      - name: Run umask diagnostic
        run: |
          set -euo pipefail

          python3 tests/reference          python3 tests/reference             --mkdir-bin "$GNU_MKDIR" \
            2>&1 | tee mkdir-macos-diagnostic.txt

      - name: Run complete mkdir self-check
        id: selfcheck
        cont        cont        cont        cont        cont  o         cont        MKDIR_ORACLE_BIN="$GNU_M        cont        cont       mkdir-test-suite/selfcheck.sh \
            2>&1 | tee mkdir-macos-selfcheck.txt

          STATUS="${PIPESTATUS[0]}"          STATUS="${PIPESTATUS[0]}"          STATUS="${PIPES      exit "$STATUS"

      - name: Report self-check status
        if: always()
        run: |
          echo "mkdir self-check exit code: ${{ steps.selfcheck.outputs.exit_code }}"

      - name: Verify frozen suites were not modified
        if: always()
        run: |
          set -euo pipefail
          set -euo pipefail
suites were not modified
.selfcheck.output  .selfcheck.outputit.selfcheckxt


selfcheck.output  .selfcheck.outtaselfcheck.outhen
            echo "ERROR: the frozen mkdir suite changed." >&2
            exit 1
          fi

          echo "Frozen mkdir suites unchanged."

      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
                                                                                                                                                                              eck.txt
            frozen-suite-status.txt
          if-no-files-found: warn
          retention-days: 7
